  @if (blog.isLoading()){
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  } @else if (blog.hasValue()) {
    <form class="form">
      <mat-form-field class="full-width" appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput placeholder="Ex. Pizza" [value]="blog.value().title">
      </mat-form-field>
      <mat-form-field class="full-width" appearance="fill">
        <mat-label>Age</mat-label>
        <input matInput placeholder="Ex. Pizza" [value]="blog.value().category">
      </mat-form-field>
    </form>
  }
